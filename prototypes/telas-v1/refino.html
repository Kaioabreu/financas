<title>PROTÓTIPO · Refino do v1</title>
<!--
  PROTOTYPE, throwaway. Do not build on this code.
  Round 3 of issue #5 ("Como devem ser as telas do v1?").
  Decided so far: five fixed tabs (round 1); the round-2 "Cédula" layout, thin line icons and Archivo text (round 2);
  white or black background following light/dark mode; no banknote, no hatching, no dashed decoration, no Bodoni.
  Question now: which type pairing for titles and numbers (Archivo, Jost, or Archivo text with Jost titles and numbers)?
  Switch with ?variant=A|B|C and the floating bar (keys ← →); the moon/sun button flips light/dark.
  Sample data is invented in the shape of the author's spreadsheet. No value is real.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Jost:wght@300..700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#d9d8d3;color:#1c1c1e;-webkit-font-smoothing:antialiased}
body.dark-stage{background:#2a2a2c}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;letter-spacing:inherit}
button:disabled{opacity:.3;cursor:default}
:focus-visible{outline:2px solid #2D62B0;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- stage (not part of the design) ---------- */
.stage{min-height:100vh;display:flex;gap:40px;align-items:center;justify-content:center;padding:28px 24px 100px}
.phone{width:390px;height:800px;border-radius:48px;border:12px solid #17171a;background:#000;position:relative;overflow:hidden;box-shadow:0 40px 80px -30px rgba(0,0,0,.45);flex:none}
#app{position:absolute;inset:0;overflow:hidden}
#app>div{height:100%}
#app *{scrollbar-width:none}
#app *::-webkit-scrollbar{display:none}
.notes{width:340px;font-size:14px;line-height:1.55;color:#33322f;max-height:800px;overflow:auto}
.dark-stage .notes{color:#d8d6d0}
.notes .n-tag{display:inline-block;background:#ffcc00;color:#111;font-weight:700;font-size:11px;letter-spacing:.06em;padding:3px 8px;border-radius:6px}
.notes h1{font-size:22px;margin:10px 0 2px}
.notes h2{font-size:17px;margin:14px 0 4px}
.notes h3{font-size:13px;opacity:.7;margin:16px 0 4px}
.notes ul{padding-left:18px}.notes li{margin:3px 0}
.notes .state{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:rgba(127,127,127,.12);border-radius:8px;padding:8px 10px;white-space:pre-wrap}
.notes .fine{font-size:12px;opacity:.75;margin-top:12px}
.switcher{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;background:#111;color:#fff;border-radius:999px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:1000;font-size:14px;outline:2px dashed #ffcc00;outline-offset:3px;font-family:system-ui,sans-serif}
.switcher button{width:38px;height:38px;border-radius:50%;color:#fff;font-size:18px;text-align:center}
.switcher button:hover{background:#333}
.switcher .lbl{padding:0 10px;min-width:170px;text-align:center;font-weight:600;white-space:nowrap}
.switcher .sep{width:1px;height:22px;background:#444;margin:0 4px}
@media (max-width:820px){.notes{display:none}}
@media (max-width:520px){.stage{padding:0;display:block}.phone{width:100vw;height:100vh;height:100dvh;border:0;border-radius:0}.switcher{top:8px;bottom:auto;font-size:12px}.switcher .lbl{min-width:110px}.switcher button{width:30px;height:30px}}

/* ---------- shared ---------- */
.amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet-bg{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:88%;overflow:auto;cursor:default}
.toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:50;padding:12px 16px;font-size:13.5px}
.rtog{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font-size:13.5px;line-height:1.35}
.rtog .sw{width:38px;height:22px;position:relative;flex:none;transition:background .15s}
.rtog .sw::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;transition:left .15s}
.rtog.on .sw::after{left:19px}
.rtog small{display:block;opacity:.7;font-size:12px}
.rule-row{display:flex;align-items:center;gap:10px;padding:12px 0;font-size:14px}
.rule-row span{flex:1}.rule-row small{display:block;opacity:.65;font-size:12px}
.rule-row button{width:32px;height:32px;text-align:center}
.empty{text-align:center;padding:40px 24px;line-height:1.45}
.empty p{font-size:13.5px;opacity:.75;margin-top:6px}
.swap{display:block;margin:18px auto 6px;font-size:13px;text-decoration:underline;text-underline-offset:3px;opacity:.75}

/* ---------- the look (one design, three type pairings, light + dark) ---------- */
.r3{--bg:#FFFFFF;--ink:#111418;--ink2:#5E6670;--rule:#E7E9EC;--track:#F0F2F4;--acc:#2D62B0;--pos:#1E7A4C;--neg:#B8325A;

  --fx-v:'wdth' 100,'wght' 400;--fx-b:'wdth' 100,'wght' 600;--ft-v:'wdth' 100,'wght' 720;--fn-v:'wdth' 100,'wght' 620;

.r3 .ttl{font-family:var(--ft),sans-serif;font-variation-settings:var(--ft-v)}
.r3 .bold{font-variation-settings:var(--fx-b)}
.r3-head{padding:24px 22px 4px}
.r3-top{display:flex;justify-content:space-between;align-items:baseline}
.r3-title{font-size:32px;letter-spacing:-.02em;line-height:1.1}
.r3-link{font-size:13px;color:var(--acc);font-variation-settings:var(--fx-b)}
.r3-month{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:14px;color:var(--ink2)}
.r3-month button{width:28px;height:28px;border:1px solid var(--rule);border-radius:50%;color:var(--ink);font-size:15px;text-align:center}
.r3-month em{font-style:normal;font-size:12px;color:var(--neg)}
.r3-main{flex:1;overflow-y:auto;padding:10px 20px 28px}
.r3-hero{padding:10px 0 6px}
.r3-hero .k{font-size:13.5px;color:var(--ink2)}
.r3-hero .v{font-size:46px;letter-spacing:-.025em;line-height:1.08;margin-top:2px}
.r3-hero .s{font-size:12.5px;color:var(--ink2);margin-top:4px}
.r3-sec{margin-top:28px}
.r3-h{font-size:17px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.r3-h small{font-family:var(--fx),sans-serif;font-variation-settings:var(--fx-v);font-size:12px;color:var(--ink2);text-align:right}
.r3-legend{display:flex;gap:18px;font-size:12px;color:var(--ink2);margin-top:6px}
.r3-legend span{display:flex;align-items:center;gap:6px}
.r3-legend i{width:12px;height:8px;border-radius:2px;display:block}
.r3-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule);width:100%;text-align:left}
.r3-row:last-child{border-bottom:0}
.r3-row.block{display:block}

.r3-ic{width:38px;height:38px;border-radius:50%;border:1px solid;display:grid;place-items:center;flex:none}
.r3-ic.sm{width:32px;height:32px}
.r3-row .t{flex:1;min-width:0}

.r3-row .r{text-align:right;flex:none}

.r3-seg{display:flex;gap:22px;margin:6px 0 14px;font-size:15px;border-bottom:1px solid var(--rule)}
.r3-seg button,.r3-accs button{padding:8px 0;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
.r3-seg button.on,.r3-accs button.on{color:var(--ink);border-color:var(--ink);font-variation-settings:var(--fx-b)}
.r3-accs{display:flex;gap:18px;overflow-x:auto;margin:4px 0 6px;font-size:14px;border-bottom:1px solid var(--rule)}
.r3-accs button{flex:none}
.r3-filter{display:inline-flex;gap:6px;align-items:center;font-size:13px;margin:10px 0 0;padding:5px 12px;border:1px solid var(--ink);border-radius:999px}
.r3-day{font-size:13px;font-variation-settings:var(--fx-b);color:var(--ink2);margin:20px 0 0}
.r3-big{font-size:44px;letter-spacing:-.025em;line-height:1.08}

.r3-fine{font-size:12px;color:var(--ink2);line-height:1.45;margin-top:8px}
.r3-items{padding:2px 0 8px 46px;font-size:13px;color:var(--ink2)}
.r3-items div{display:flex;justify-content:space-between;padding:3px 0}
.r3-tabs{display:flex;background:var(--bg);border-top:1px solid var(--rule);padding:10px 4px 20px}

.r3-tabs button.on{color:var(--ink);font-variation-settings:var(--fx-b)}
.r3-tabs button.on::before{content:'';position:absolute;top:-11px;width:18px;height:2px;border-radius:1px;background:var(--ink)}
.r3 .sheet-bg{background:rgba(0,0,0,.45)}
.r3 .sheet{background:var(--bg);border-radius:18px 18px 0 0;border-top:1px solid var(--rule);padding:20px 22px 26px}
.r3-sh-d{font-size:15px;color:var(--ink2)}
.r3-sh-v{font-size:34px;letter-spacing:-.02em;margin:2px 0}
.r3-cats{display:grid;grid-template-columns:1fr 1fr;column-gap:16px;margin-top:8px}
.r3-cats button{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14px;text-align:left}
.r3-cats button.on{font-variation-settings:var(--fx-b)}
.r3-cats button.on::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--acc);margin-left:auto}
.r3 .rtog{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:12px 0;margin-top:14px}
.r3 .rtog .sw{background:var(--rule);border-radius:11px}.r3 .rtog .sw::after{border-radius:50%}
.r3 .rtog.on .sw{background:var(--acc)}
.r3 .rule-row{border-bottom:1px solid var(--rule)}
.r3 .rule-row button{border:1px solid var(--rule);border-radius:50%}
.r3 .toast{background:var(--ink);color:var(--bg);border-radius:12px}
</style>
</head>
<body>

</div>

  if (S.tab === 'gastos') {

    if (S.gmode === 'cat') {
      const size = 210, th = 18, r = (size - th) / 2, c = size / 2, C = 2 * Math.PI * r, total = sum.groups.reduce((a, g) => a + g.v, 0); let off = 0;
      let ring = `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="display:block;margin:4px auto 10px">`;
      sum.groups.forEach(g => { const len = C * g.v / total; ring += `<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${g.color}" stroke-width="${th}" stroke-dasharray="${Math.max(0, len - 2.5)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 ${c} ${c})"/>`; off += len; });

    } else {

      let svg = `<svg viewBox="0 0 ${W} ${H}" style="display:block;width:100%;height:auto"><line x1="0" x2="${W}" y1="${p.t + ih + .5}" y2="${p.t + ih + .5}" stroke="${P.rule}"/>`;

      b += `<div style="margin-top:12px">${ws.map((w, i) => `<button class="r3-row" data-act="go-week" data-arg="${i}"><span class="t"><span class="d">${w.start} a ${w.end} de ${MF[mo.m]}</span><span class="s">${w.n} compras</span></span><span class="r"><b class="num">${fmt(w.total)}</b></span></button>`).join('')}</div>`;

  }
  if (S.tab === 'tx') {

    const list = txList(sum);

    for (const g of groupByDay(list)) b += `<div class="r3-day">${dayLong(g.date)}</div>${g.items.map(t => { const v = txInfo(t), src = t.kind === 'gasto' ? catSource(t) : 'pluggy'; return `<button class="r3-row ${v.muted ? 'muted' : ''}" data-act="tx-open" data-arg="${t.id}">${ic(v.icon, v.color)}<span class="t"><span class="d">${esc(t.desc)}</span><span class="s">${v.label}${src !== 'pluggy' ? `, <em>${src === 'regra' ? 'por regra' : 'mudada por você'}</em>` : ''}${v.tag ? `, ${v.tag}` : ''}</span></span><span class="r"><b class="num" style="${t.amount > 0 ? `color:${P.pos}` : ''}">${signed(t.amount)}</b><small>${ACC[t.acc].short}</small></span></button>`; }).join('')}`;
  }
  if (S.tab === 'pat') {
    const { cur, prev, ser } = patNow(), W = 330, H = 170, p = { l: 10, r: 10, t: 14, b: 24 }, g = lineGeom(ser, W, H, p);
    let svg = `<svg viewBox="0 0 ${W} ${H}" style="display:block;width:100%;height:auto"><line x1="0" x2="${W}" y1="${g.base + .5}" y2="${g.base + .5}" stroke="${P.rule}"/>`;
    for (let i = 0; i < ser.length - 1; i++) svg += `<line x1="${g.X(i)}" y1="${g.Y(ser[i].v)}" x2="${g.X(i + 1)}" y2="${g.Y(ser[i + 1].v)}" stroke="${ser[i].est ? P.ink2 : P.acc}" stroke-width="2.5" stroke-linecap="round" opacity="${ser[i].est ? .55 : 1}"/>`;
    ser.forEach((q, i) => { svg += `<circle cx="${g.X(i)}" cy="${g.Y(q.v)}" r="4.5" fill="${q.est ? P.bg : P.acc}" stroke="${q.est ? P.ink2 : P.acc}" stroke-width="2"/><text x="${g.X(i)}" y="${H - 6}" text-anchor="middle" font-size="12" style="${TXT}" fill="${P.ink2}">${q.label}</text>`; });
    b += `<div class="r3-hero"><div class="k">Patrimônio hoje</div><div class="v num">${fmt(cur)}</div><div class="s" style="color:${P.pos}">${signed(cur - prev)} desde o fim de outubro</div></div><div style="margin-top:14px">${svg}</svg></div><div class="r3-legend"><span><i style="background:${P.ink2};opacity:.55"></i>Estimado pelas movimentações</span><span><i style="background:${P.acc}"></i>Retratos do app</span></div>`;
    let x = 0, seg = ''; PAT.classes.forEach((c, i) => { const w = 330 * c.value / cur; seg += `<rect x="${x + (i ? 1 : 0)}" y="0" width="${Math.max(2, w - (i ? 2 : 0))}" height="10" fill="${P.classes[c.key]}"/>`; x += w; });

    else {
      b += `<div class="r3-hero"><div class="k">Saldo nos benefícios</div><div class="v num">${fmt(benTotal())}</div><div class="s">${BEN.provider}</div></div>`;

      b += `<section class="r3-sec"><h2 class="r3-h ttl">Movimentações</h2>${BEN.tx.map(t => `<div class="r3-row"><span class="t"><span class="d">${t.desc}</span><span class="s">${t.wallet}, ${dayShort(t.date)}</span></span><span class="r"><b class="num" style="${t.amount > 0 ? `color:${P.pos}` : ''}">${signed(t.amount)}</b></span></div>`).join('')}</section>`;

  }
  if (S.sheet && S.sheet.rules) sheet = `<div class="sheet-bg" data-act="sheet-close"><div class="sheet" data-act="noop"><h2 class="r3-h ttl" style="font-size:24px">Regras de categoria</h2>${rulesBody('✕')}</div></div>`;
  return `<div class="r3 ${S.mode === 'dark' ? 'dark' : ''} ${FONTS[S.variant].cls}">${head}<main class="r3-main" data-scroll="${S.tab}-${S.gmode}">${b}</main>${tabs}${sheet}${toastHTML()}</div>`;

// ============================================================
// Notes panel, actions, render loop
// ============================================================
function renderNotes() {
  const f = FONTS[S.variant], rules = S.rules.length ? S.rules.map(r => `  “${r.match}” vira ${CATS[r.cat].label}`).join('\n') : '  nenhuma';
  document.getElementById('notes').innerHTML = `<span class="n-tag">PROTÓTIPO · DESCARTÁVEL</span><h1>Refino do v1</h1><p style="font-size:13px;opacity:.75">Rodada 3. Um visual só, montado a partir do que você aprovou: layout, ícones e texto da Cédula, fundo branco ou preto. Saíram a nota, as hachuras, os tracejados e a Bodoni.</p><h2>${S.variant}. ${f.name}</h2><p>${f.idea}</p>
  <h3>Para reparar</h3><ul>
  <li>Fique numa aba e troque a fonte com ← →.</li>
  <li>Use o botão de lua e sol para ver o modo escuro.</li>
  <li>Os números grandes (saldo, patrimônio) e os valores das listas ficaram bons?</li>
  <li>O resumo sem a nota: saldo grande e as três linhas abaixo. Falta alguma coisa?</li>
  <li>Patrimônio: o trecho estimado agora é cinza, sem tracejado. Ficou claro?</li></ul>
  <h3>Estado (em memória)</h3><div class="state">fonte: ${f.name}
modo: ${S.mode === 'dark' ? 'escuro' : 'claro'}
aba: ${S.tab}
mês: ${S.month}
regras:
${esc(rules)}
ajustes manuais: ${Object.keys(S.overrides).length}</div>
  <p class="fine">Dados inventados no formato da sua planilha. Nenhum valor é real. As cores de categoria passaram no validador de daltonismo nos dois modos.</p>`;
}
let toastTimer;
function toast(msg) { S.toast = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; render(); }, 3000); }
function applyRecat(id, cat) {
  const t = findTx(id);
  if (S.ruleOn) {
    const key = ruleKey(t);
    S.rules = S.rules.filter(r => r.match.toLowerCase() !== key.toLowerCase()); S.rules.unshift({ match: key, cat });
    ALL_TX.forEach(x => { if (ruleKey(x).toLowerCase().includes(key.toLowerCase())) delete S.overrides[x.id]; });
    toast(`Regra criada: “${esc(key)}” vira ${CATS[cat].label} em ${countRule(S.rules[0])} transações`);
  } else { S.overrides[id] = cat; toast(`“${esc(t.desc)}” agora é ${CATS[cat].label}`); }
  S.ruleOn = false;
}
function setVariant(v) { S.variant = v; try { const u = new URL(location.href); u.searchParams.set('variant', v); history.replaceState(null, '', u); } catch (e) { /* file:// may refuse */ } }

const ACT = {
  'variant-prev': () => setVariant(ORDER[(ORDER.indexOf(S.variant) + 2) % 3]), 'variant-next': () => setVariant(ORDER[(ORDER.indexOf(S.variant) + 1) % 3]),
  'mode': () => { S.mode = S.mode === 'dark' ? 'light' : 'dark'; },
  'month-prev': () => shiftMonth(-1), 'month-next': () => shiftMonth(1),
  'tab': t => { S.tab = t; S.sheet = null; if (t !== 'tx') { S.cat = null; S.week = null; } },
  'gmode': m => { S.gmode = m; }, 'acc': a => { S.acc = a; },
  'go-cat': c => { S.tab = 'tx'; S.cat = c; S.week = null; S.acc = 'all'; }, 'go-week': i => { S.tab = 'tx'; S.week = +i; S.cat = null; S.acc = 'all'; },
  'clear': () => { S.cat = null; S.week = null; }, 'pat-open': k => { S.patOpen = S.patOpen === k ? null : k; },
  'rules': () => { S.sheet = { rules: true }; }, 'sheet-close': () => { S.sheet = null; },
  'tx-open': id => { S.ruleOn = false; S.sheet = { tx: id }; }, 'rule-toggle': () => { S.ruleOn = !S.ruleOn; },
  'recat': (cat, el) => { applyRecat(el.dataset.tx, cat); S.sheet = null; }, 'rule-del': i => { S.rules.splice(+i, 1); },
  'ben-empty': () => { S.benEmpty = !S.benEmpty; },
};
function render() {
  const app = document.getElementById('app');
  app.querySelectorAll('[data-scroll]').forEach(el => { SCROLL[el.dataset.scroll] = el.scrollTop; });
  app.innerHTML = R();
  app.querySelectorAll('[data-scroll]').forEach(el => { const y = SCROLL[el.dataset.scroll]; if (y) el.scrollTop = y; });
  document.getElementById('sw-label').textContent = `${S.variant}. ${FONTS[S.variant].name}`;
  document.getElementById('sw-mode').textContent = S.mode === 'dark' ? '☀' : '☾';
  document.body.classList.toggle('dark-stage', S.mode === 'dark');
  renderNotes();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.getAttribute('data-act'); if (act === 'noop') return;
  const fn = ACT[act]; if (!fn) return;
  fn(el.getAttribute('data-arg'), el); render();
});
document.addEventListener('keydown', e => {
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable)) return;
  if (e.key === 'ArrowLeft') { ACT['variant-prev'](); render(); }
  if (e.key === 'ArrowRight') { ACT['variant-next'](); render(); }
});
S.mode = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
const q = new URLSearchParams(location.search), qv = (q.get('variant') || '').toUpperCase();
if (ORDER.includes(qv)) S.variant = qv;
if (q.get('mode') === 'dark' || q.get('mode') === 'light') S.mode = q.get('mode');
render();
if (document.fonts) document.fonts.ready.then(render);

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTÓTIPO · Telas do v1</title>
<!--
  PROTOTYPE, throwaway. Do not build on this code.
  Question (issue #5, "Como devem ser as telas do v1?"): which navigation and visual style should the v1 screens have?
  Plan: three radically different variants of the whole v1 app on one page, switchable via ?variant=A|B|C
  and the floating bottom bar (keys ← →). All state is in memory; reload resets it.
  Sample data is invented in the shape of the author's spreadsheet. No value is real.
  Run: open this file in a browser (double-click).
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:#dcdad4;color:#1c1c1e;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:disabled{opacity:.3;cursor:default}

/* ---------- stage (not part of the design) ---------- */
.stage{min-height:100vh;display:flex;gap:40px;align-items:center;justify-content:center;padding:28px 24px 100px}
.phone{width:390px;height:800px;border-radius:48px;border:12px solid #121212;background:#000;position:relative;overflow:hidden;box-shadow:0 40px 80px -30px rgba(0,0,0,.45);flex:none}
#app{position:absolute;inset:0;overflow:hidden}
#app>div{height:100%}
#app *{scrollbar-width:none}
#app *::-webkit-scrollbar{display:none}
.notes{width:340px;font-size:14px;line-height:1.55;color:#33322f;max-height:800px;overflow:auto}
.notes .n-tag{display:inline-block;background:#ffcc00;color:#111;font-weight:700;font-size:11px;letter-spacing:.06em;padding:3px 8px;border-radius:6px}
.notes h1{font-size:22px;margin:10px 0 2px}
.notes h2{font-size:17px;margin:14px 0 4px}
.notes h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#77736b;margin:16px 0 4px}
.notes ul{padding-left:18px}
.notes li{margin:3px 0}
.notes .state{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:#f3f1ec;border-radius:8px;padding:8px 10px;white-space:pre-wrap}
.notes .fine{font-size:12px;color:#77736b;margin-top:12px}
.switcher{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;background:#111;color:#fff;border-radius:999px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:1000;font-size:14px;outline:2px dashed #ffcc00;outline-offset:3px}
.switcher button{width:38px;height:38px;border-radius:50%;color:#fff;font-size:18px;text-align:center}
.switcher button:hover{background:#333}
.switcher .lbl{padding:0 10px;min-width:190px;text-align:center;font-weight:600;white-space:nowrap}
@media (max-width:820px){.notes{display:none}}
@media (max-width:520px){.stage{padding:0;display:block}.phone{width:100vw;height:100vh;height:100dvh;border:0;border-radius:0}.switcher{top:8px;bottom:auto;font-size:12px}.switcher .lbl{min-width:140px}.switcher button{width:30px;height:30px}}

/* ---------- shared bits ---------- */
.amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.pos{color:#12935a}.neg{color:#d93a3a}
.muted{opacity:.45}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:6px;background:rgba(127,127,127,.16);margin-left:6px;vertical-align:1px;white-space:nowrap}
.toast{position:absolute;left:14px;right:14px;bottom:92px;background:#16181d;color:#fff;border-radius:12px;padding:11px 14px;font-size:13px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.rtog{display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;border-radius:12px;margin:10px 0 4px;font-size:13px;background:var(--rt-bg,#f2f3f6);text-align:left}
.rtog .sw{width:36px;height:21px;border-radius:11px;background:#c3c7cf;position:relative;flex:none;transition:.15s}
.rtog .sw::after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.15s}
.rtog.on .sw{background:var(--rt-on,#2457e6)}
.rtog.on .sw::after{left:17px}
.rtog small{display:block;opacity:.65;font-size:11.5px}
.rule{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(127,127,127,.18);font-size:14px}
.rule span{flex:1}.rule small{display:block;opacity:.6;font-size:12px}
.rule button{width:30px;height:30px;border-radius:50%;background:rgba(127,127,127,.15);text-align:center}
.note{font-size:13px;opacity:.75;line-height:1.45;margin:8px 0}
.empty-state{text-align:center;padding:36px 20px;line-height:1.45}
.empty-state .ic{font-size:40px;margin-bottom:8px}
.empty-state p{font-size:13px;opacity:.7;margin-top:6px}
.linkbtn{display:block;margin:14px auto;font-size:13px;text-decoration:underline;opacity:.75}

/* ---------- Variant A: tabs ---------- */

.va-tabs{display:flex;border-top:1px solid #e1e3e8;background:#fff;padding:6px 2px 18px}

.va-tabs button.on{color:#2457e6;font-weight:600}

.va-ch{font-size:13px;font-weight:600;color:#6b7280;margin-bottom:8px}

.va-kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}

.va-kpi .v{font-size:19px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}

.va .chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.va .chip{flex:none;padding:6px 12px;border-radius:999px;background:#fff;border:1px solid #e1e3e8;font-size:13px;color:#3f4450}

.va-filter{display:inline-block;font-size:13px;font-weight:600;background:#e8eefc;color:#2457e6;padding:5px 10px;border-radius:8px;margin-bottom:10px}
.va-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f0f1f4;width:100%;text-align:left}

.va-ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:none}
.va-row .t{flex:1;min-width:0;display:flex;flex-direction:column}
.va-row .d{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.va-row .s{font-size:12px;color:#8a909c;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.va-row .r{display:flex;flex-direction:column;align-items:flex-end}

.va-day{font-size:12px;font-weight:600;color:#8a909c;margin:12px 4px 6px}
.va-list{padding-top:2px;padding-bottom:2px}
.va-big{font-size:30px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.va-sub{font-size:13px;color:#6b7280;margin:6px 2px}
.va-note{font-size:11.5px;color:#8a909c;margin-top:8px;line-height:1.4}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.stackbar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;margin:6px 0 8px}

.va-sublist{background:#f7f8fa;border-radius:10px;padding:6px 12px;margin:0 0 8px;font-size:13px}

.va-ben{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:6px}
.va-ben .v{font-size:15px}
.sheet-bg{position:absolute;inset:0;background:rgba(10,12,16,.38);z-index:40;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:10px 18px 26px;max-height:88%;overflow:auto;cursor:default}

.sh-title{font-size:18px;font-weight:700;margin-bottom:6px}

.catbtn span{font-size:20px}
.catbtn.on{border-color:#2457e6;background:#eef3ff;font-weight:600}

/* ---------- Variant B: single dashboard ---------- */
.vb{background:#0e1116;color:#e8eaed;display:flex;flex-direction:column;position:relative;--rt-bg:#1a1f27;--rt-on:#7aa2ff}
.vb-top{padding:18px 16px 6px}
.vb-upd{font-size:11.5px;color:#6b7480;margin:0 2px 8px}
.vb-pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}

.vb-main{flex:1;overflow-y:auto;padding:0 16px 28px}

.vb-acc .r{text-align:right}.vb-acc .r .s{font-size:11px}
.vb-pat{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.vb-pat .t{flex:1}

.vb-page-h{display:flex;align-items:center;gap:10px;padding:16px 12px 10px}
.vb-page-h b{font-size:17px}
.vb-back{width:36px;height:36px;border-radius:50%;background:#1a1f27;font-size:20px;text-align:center}
.vb-sub{font-size:12.5px;color:#9aa3af;margin:0 2px 8px}
.vb-day{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6b7480;margin:14px 0 2px}
.vb-tx{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #161b22;width:100%;text-align:left}

.vb-tx .d{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vb-tx .s{font-size:11.5px;color:#6b7480;margin-top:1px}

.vb-txhero .d{font-size:17px;font-weight:600;margin-top:4px}
.vb-txhero .s{font-size:13px;color:#9aa3af;margin-top:2px}
.vb-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6b7480;margin:16px 0 6px}

.vb-catrow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid #161b22;width:100%;text-align:left;font-size:15px}

.vb-catrow.on{color:#7aa2ff}
.vb-box{background:#151a21;border-radius:16px;padding:14px;margin:6px 0 12px}

.vb-cls .it{display:flex;justify-content:space-between;font-size:12.5px;color:#9aa3af;padding:3px 0 0 18px}
.vb .tag{background:#222935;color:#c4cad3}
.vb .toast{background:#e8eaed;color:#0e1116;bottom:24px}

/* ---------- Variant C: wallet ---------- */
.vc{background:#fbfaf7;color:#1d1b18;display:flex;flex-direction:column;position:relative;--rt-bg:#f1eee7;--rt-on:#d65c33}
.vc-head{padding:18px 18px 4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.vc-hi{font-size:26px;font-weight:750;letter-spacing:-.02em;font-family:Georgia,"Times New Roman",serif}
.vc-upd{font-size:11.5px;color:#9a9388}
.vc-mctl{display:flex;align-items:center;gap:4px;background:#f1eee7;border-radius:999px;padding:3px;font-size:13px;font-weight:600}
.vc-mctl button{width:26px;height:26px;border-radius:50%;text-align:center}

.vc-strip{margin:10px 16px 4px;padding:12px 12px;border-radius:18px;background:#f1eee7;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.vc-strip .k{font-size:10.5px;color:#7b756b;text-transform:uppercase;letter-spacing:.05em}
.vc-strip .v{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.vc-main{flex:1;overflow-y:auto;padding:12px 16px 100px}
.wcard{border-radius:20px;color:#fff;padding:14px 18px;height:124px;position:relative;box-shadow:0 -6px 18px -10px rgba(0,0,0,.45);margin-bottom:-62px;display:flex;flex-direction:column;justify-content:flex-start;width:100%;text-align:left;overflow:hidden}
.wcard:last-child{margin-bottom:0}
.wcard .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wcard .n{font-size:14px;font-weight:600;opacity:.92}
.wcard .b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.wcard .m{font-size:11.5px;opacity:.8;margin-top:3px}
.wcard .chipmark{position:absolute;right:18px;bottom:14px;width:34px;height:24px;border-radius:5px;background:rgba(255,255,255,.25)}
.wcard .lbl2{position:absolute;left:18px;bottom:14px;font-size:11px;opacity:.7;letter-spacing:.12em}
.wcard.solo{margin:4px 0 14px;height:132px}
.vc-fab{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:#1d1b18;color:#fbfaf7;border-radius:999px;padding:13px 24px;font-weight:700;font-size:15px;box-shadow:0 12px 24px -8px rgba(0,0,0,.5);white-space:nowrap;z-index:5}
.vc-back{font-size:15px;font-weight:600;padding:6px 4px}
.vc-hbtn{font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:999px;background:#f1eee7}
.vc-day{font-size:12px;font-weight:600;color:#9a9388;margin:14px 2px 4px;font-family:Georgia,serif;font-style:italic}
.vc-tx{display:flex;gap:10px;align-items:flex-start;padding:10px 2px;border-bottom:1px solid #eee9df}
.vc-tx .l{flex:1;min-width:0}
.vc-tx .d{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vc-tx .s{margin-top:5px;display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-size:11.5px;color:#9a9388}
.vc-tx .s em{font-style:normal;color:#d65c33;font-weight:600}
.cchip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--c) 14%,#fff);color:color-mix(in srgb,var(--c) 70%,#1d1b18);border:1px solid color-mix(in srgb,var(--c) 30%,#fff)}
.cchip.open{outline:2px solid #1d1b18}
.cchip.flat{background:#f1eee7;color:#7b756b;border-color:#e6e1d6}
.cchip.on{background:var(--c);color:#fff}
.vc-pop{background:#f1eee7;border-radius:14px;padding:10px 12px 12px;margin:2px 0 8px}
.vc-pop .h{font-size:12px;font-weight:700;color:#7b756b;margin-bottom:6px}
.vc-pop .chs{display:flex;flex-wrap:wrap;gap:6px}
.vc-pop .rtog{background:#fbfaf7;margin:0 0 10px}
.vc-an{position:absolute;inset:0;z-index:30;background:rgba(29,27,24,.35);display:flex;flex-direction:column;justify-content:flex-end}

  const W = o.w, H = o.h, p = { l: 4, r: 4, t: 10, b: 22 }, iw = W - p.l - p.r, ih = H - p.t - p.b;
  const max = Math.max(1, ...data.flatMap(d => [d.a, d.b])), gw = iw / data.length, bw = Math.min(14, (gw - 12) / 2);

}
function setVariant(v) {
  S.variant = v;
  try { const u = new URL(location.href); u.searchParams.set('variant', v); history.replaceState(null, '', u); } catch (e) { /* file:// may refuse; fine */ }
}
const shiftMonth = d => { const i = Math.min(MONTHS.length - 1, Math.max(0, monthIdx() + d)); S.month = MONTHS[i].key; S.C.dayOpen = null; S.C.catOpen = null; };
const ACT = {
  'variant-prev': () => setVariant(ORDER[(ORDER.indexOf(S.variant) + ORDER.length - 1) % ORDER.length]),
  'variant-next': () => setVariant(ORDER[(ORDER.indexOf(S.variant) + 1) % ORDER.length]),
  'month-prev': () => shiftMonth(-1), 'month-next': () => shiftMonth(1), 'month-set': k => { S.month = k; },
  'a-tab': t => { S.A.tab = t; if (t !== 'tx') { S.A.cat = null; S.A.week = null; } }, 'a-gmode': m => { S.A.gmode = m; }, 'a-acc': a => { S.A.acc = a; },
  'a-cat': c => { S.A.tab = 'tx'; S.A.cat = c; S.A.week = null; S.A.acc = 'all'; }, 'a-week': i => { S.A.tab = 'tx'; S.A.week = +i; S.A.cat = null; S.A.acc = 'all'; },
  'a-clear': () => { S.A.cat = null; S.A.week = null; }, 'a-pat': n => { S.A.patOpen = S.A.patOpen === n ? null : n; },
  'a-rules': () => { S.A.sheet = { rules: true }; }, 'sheet-close': () => { S.A.sheet = null; },
  'tx-open': id => { S.ruleOn = false; if (S.variant === 'A') S.A.sheet = { tx: id }; else if (S.variant === 'B') S.B.stack.push({ p: 'tx', id }); else S.C.pop = S.C.pop === id ? null : id; },
  'rule-toggle': () => { S.ruleOn = !S.ruleOn; },
  'recat': (cat, el) => { applyRecat(el.dataset.tx, cat); if (S.variant === 'A') S.A.sheet = null; else if (S.variant === 'B') S.B.stack.pop(); else S.C.pop = null; },
  'rule-del': i => { S.rules.splice(+i, 1); },
  'b-push': j => { S.B.stack.push(JSON.parse(j)); }, 'b-back': () => { S.B.stack.pop(); },
  'c-open': k => { S.C.open = k; S.C.pop = null; S.C.rules = false; }, 'c-close': () => { S.C.open = null; S.C.pop = null; },
  'c-analysis': () => { S.C.analysis = !S.C.analysis; }, 'c-atab': t => { S.C.atab = t; S.C.catOpen = null; S.C.dayOpen = null; },
  'c-cat': c => { S.C.catOpen = S.C.catOpen === c ? null : c; }, 'c-day': d => { S.C.dayOpen = S.C.dayOpen === +d ? null : +d; }, 'c-rules': () => { S.C.rules = !S.C.rules; },
  'ben-empty': () => { S.benEmpty = !S.benEmpty; },
};
function render() {
  const app = document.getElementById('app');
  app.querySelectorAll('[data-scroll]').forEach(el => { SCROLL[el.dataset.scroll] = el.scrollTop; });
  app.innerHTML = VARIANTS[S.variant].view();
  app.querySelectorAll('[data-scroll]').forEach(el => { const y = SCROLL[el.dataset.scroll]; if (y) el.scrollTop = y; });
  document.getElementById('sw-label').textContent = `${S.variant} · ${VARIANTS[S.variant].name}`;
  renderNotes();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act; if (act === 'noop') return;
  const fn = ACT[act]; if (!fn) return;
  fn(el.dataset.arg, el); render();
});
document.addEventListener('keydown', e => {
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable)) return;
  if (e.key === 'ArrowLeft') { ACT['variant-prev'](); render(); }
  if (e.key === 'ArrowRight') { ACT['variant-next'](); render(); }
});
const qv = (new URLSearchParams(location.search).get('variant') || '').toUpperCase();
if (ORDER.includes(qv)) S.variant = qv;
render();
</script>

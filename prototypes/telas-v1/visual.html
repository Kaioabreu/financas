<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTÓTIPO · Visual do v1</title>
<!--
  PROTOTYPE, throwaway. Do not build on this code.
  Round 2 of issue #5 ("Como devem ser as telas do v1?"). Navigation is decided: five fixed tabs (round 1, variant A).
  Question now: which visual language (type, palette, icons, charts, components) should those tabs wear?
  Plan: three visual directions of the same five-tab app, switchable via ?variant=A|B|C and the floating bar (keys ← →).
  State is shared across directions, so you can stay on one screen and flip the look.
  Sample data is invented in the shape of the author's spreadsheet. No value is real.
  Run: open this file in a browser (needs internet for Google Fonts).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=Archivo:wdth,wght@62..125,100..900&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Jost:wght@300..700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#d9d8d3;color:#1c1c1e;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;letter-spacing:inherit}
button:disabled{opacity:.3;cursor:default}
:focus-visible{outline:2px solid #2147C4;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- stage (not part of the design) ---------- */
.stage{min-height:100vh;display:flex;gap:40px;align-items:center;justify-content:center;padding:28px 24px 100px}
.phone{width:390px;height:800px;border-radius:48px;border:12px solid #17171a;background:#000;position:relative;overflow:hidden;box-shadow:0 40px 80px -30px rgba(0,0,0,.45);flex:none}
#app{position:absolute;inset:0;overflow:hidden}
#app>div{height:100%}
#app *{scrollbar-width:none}
#app *::-webkit-scrollbar{display:none}
.notes{width:340px;font-size:14px;line-height:1.55;color:#33322f;max-height:800px;overflow:auto}
.notes .n-tag{display:inline-block;background:#ffcc00;color:#111;font-weight:700;font-size:11px;letter-spacing:.06em;padding:3px 8px;border-radius:6px}
.notes h1{font-size:22px;margin:10px 0 2px}
.notes h2{font-size:17px;margin:14px 0 4px}
.notes h3{font-size:13px;color:#6f6b63;margin:16px 0 4px}
.notes ul{padding-left:18px}.notes li{margin:3px 0}
.notes .state{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:#f3f1ec;border-radius:8px;padding:8px 10px;white-space:pre-wrap}
.notes .fine{font-size:12px;color:#6f6b63;margin-top:12px}
.switcher{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;background:#111;color:#fff;border-radius:999px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:1000;font-size:14px;outline:2px dashed #ffcc00;outline-offset:3px;font-family:system-ui,sans-serif}
.switcher button{width:38px;height:38px;border-radius:50%;color:#fff;font-size:18px;text-align:center}
.switcher button:hover{background:#333}
.switcher .lbl{padding:0 10px;min-width:170px;text-align:center;font-weight:600;white-space:nowrap}
@media (max-width:820px){.notes{display:none}}
@media (max-width:520px){.stage{padding:0;display:block}.phone{width:100vw;height:100vh;height:100dvh;border:0;border-radius:0}.switcher{top:8px;bottom:auto;font-size:12px}.switcher .lbl{min-width:120px}.switcher button{width:30px;height:30px}}

/* ---------- shared ---------- */
.amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet-bg{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-end}
.sheet{width:100%;max-height:88%;overflow:auto;cursor:default}
.toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:50;padding:12px 16px;font-size:13.5px}
.rtog{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font-size:13.5px;line-height:1.35}
.rtog .sw{width:38px;height:22px;position:relative;flex:none;transition:background .15s}
.rtog .sw::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;transition:left .15s}
.rtog.on .sw::after{left:19px}
.rtog small{display:block;opacity:.7;font-size:12px}
.rule-row{display:flex;align-items:center;gap:10px;padding:12px 0;font-size:14px}
.rule-row span{flex:1}.rule-row small{display:block;opacity:.65;font-size:12px}
.rule-row button{width:32px;height:32px;text-align:center}
.ca-row .d,.ca-row .s,.cb-row .d,.cb-row .s,.cc-row .d,.cc-row .s{display:block}
.empty{text-align:center;padding:40px 24px;line-height:1.45}
.empty p{font-size:13.5px;opacity:.75;margin-top:6px}
.swap{display:block;margin:18px auto 6px;font-size:13px;text-decoration:underline;text-underline-offset:3px;opacity:.75}

/* =========================================================
   A · Cédula
   ========================================================= */
.ca{--paper:#EEF1EB;--paper2:#E3E8E0;--ink:#1B2A3A;--ink2:#5B6A74;--rule:#C6CFC4;--blue:#2D62B0;--car:#B8325A;--grn:#2F7A55;
  background:var(--paper);color:var(--ink);font-family:'Archivo',sans-serif;font-variation-settings:'wdth' 94;display:flex;flex-direction:column;position:relative}
.ca .bod{font-family:'Bodoni Moda',serif;font-variant-numeric:lining-nums tabular-nums}
.ca-head{padding:24px 22px 4px}
.ca-top{display:flex;justify-content:space-between;align-items:baseline}
.ca-title{font-family:'Bodoni Moda',serif;font-weight:500;font-size:36px;letter-spacing:-.015em;line-height:1.05}
.ca-hbtn{font-size:13px;color:var(--blue);border-bottom:1px solid currentColor;padding-bottom:1px}
.ca-month{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:14px;color:var(--ink2)}
.ca-month button{width:28px;height:28px;border:1px solid var(--rule);border-radius:50%;color:var(--ink);font-size:15px;text-align:center}
.ca-month em{font-family:'Bodoni Moda',serif;color:var(--car)}
.ca-main{flex:1;overflow-y:auto;padding:10px 20px 28px}
.ca-note{position:relative;height:180px;border:3px double #93A9C6;background:#DAE4EF;overflow:hidden;margin:6px 0 16px;border-radius:4px;color:#163463}
.ca-note.neg{border-color:#D3A0AF;background:#F0DDE3;color:#6B1532}
.ca-guil{position:absolute;right:-92px;top:-26px;width:236px;height:236px;stroke:currentColor;fill:none;stroke-width:.5;opacity:.42}
.ca-corner{position:absolute;font-family:'Bodoni Moda',serif;font-weight:700;font-size:28px;line-height:1}
.ca-corner.tl{left:13px;top:15px}.ca-corner.br{right:15px;bottom:13px}
.ca-micro{position:absolute;left:4px;right:4px;font-size:5.6px;letter-spacing:.7px;white-space:nowrap;overflow:hidden;opacity:.6;text-align:center}
.ca-micro.top{top:3px}.ca-micro.bot{bottom:3px}
.ca-note-body{position:absolute;left:18px;bottom:24px;right:60px}
.ca-note-k{font-size:13px}
.ca-note-v{font-family:'Bodoni Moda',serif;font-weight:700;font-size:42px;font-variation-settings:'opsz' 40;line-height:1.05;letter-spacing:-.015em}
.ca-note-s{font-size:11.5px;opacity:.8;margin-top:3px}
.ca-led{display:flex;align-items:baseline;gap:8px;padding:6px 0;font-size:15px}
.ca-led i{flex:1;border-bottom:1.5px dotted #AEB9AC;transform:translateY(-4px)}
.ca-led b{font-family:'Bodoni Moda',serif;font-weight:600;font-size:19px;font-variant-numeric:lining-nums tabular-nums}
.ca-led b.pos{color:var(--grn)}
.ca-sec{margin-top:24px}
.ca-h{font-family:'Bodoni Moda',serif;font-style:italic;font-weight:500;font-size:19px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.ca-h small{font-family:'Archivo',sans-serif;font-style:normal;font-size:12px;color:var(--ink2)}
.ca-legend{display:flex;gap:18px;font-size:12px;color:var(--ink2);margin-top:4px}
.ca-legend span{display:flex;align-items:center;gap:6px}
.ca-legend svg{display:block}
.ca-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule);width:100%;text-align:left}
.ca-row:last-child{border-bottom:0}
.ca-ic{width:38px;height:38px;border-radius:50%;border:1px solid;display:grid;place-items:center;flex:none}
.ca-row .t{flex:1;min-width:0}
.ca-row .d{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ca-row .s{font-size:12px;color:var(--ink2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ca-row .s em{font-style:italic;font-family:'Bodoni Moda',serif;color:var(--car)}
.ca-row .r{text-align:right;flex:none}
.ca-row .r b{font-family:'Bodoni Moda',serif;font-weight:600;font-size:17px;font-variant-numeric:lining-nums tabular-nums;display:block}
.ca-row .r small{font-size:11px;color:var(--ink2)}
.ca-row.muted{opacity:.45}
.ca-tag{font-style:italic;font-family:'Bodoni Moda',serif;color:var(--ink2)}
.ca-seg{display:flex;gap:22px;margin:4px 0 14px;font-size:15px}
.ca-seg button{padding:4px 0;color:var(--ink2);border-bottom:2px solid transparent}
.ca-seg button.on{color:var(--ink);border-color:var(--ink);font-weight:600}
.ca-accs{display:flex;gap:18px;overflow-x:auto;margin:2px 0 6px;font-size:14px;border-bottom:1px solid var(--rule)}
.ca-accs button{flex:none;padding:8px 0;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
.ca-accs button.on{color:var(--ink);border-color:var(--ink);font-weight:600}
.ca-filter{display:inline-flex;gap:6px;align-items:center;font-size:13px;margin:10px 0 0;padding:5px 12px;border:1px solid var(--ink);border-radius:999px}
.ca-day{font-family:'Bodoni Moda',serif;font-style:italic;font-size:15px;margin:18px 0 0;color:var(--ink2)}
.ca-big{font-family:'Bodoni Moda',serif;font-weight:600;font-size:46px;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:lining-nums tabular-nums}
.ca-sub{font-size:13px;color:var(--ink2);margin-top:2px}
.ca-sub.pos{color:var(--grn)}
.ca-fine{font-size:11.5px;color:var(--ink2);line-height:1.45;margin-top:8px}
.ca-items{padding:2px 0 8px 50px;font-size:13px;color:var(--ink2)}
.ca-items div{display:flex;justify-content:space-between;padding:3px 0}
.ca-vouchers{display:flex;flex-direction:column;gap:12px;margin:10px 0 6px}
.ca-voucher{position:relative;display:flex;align-items:center;justify-content:space-between;padding:16px 22px;background:#F6F1DC;border:1px dashed #B9A77A;color:#4A3B12;
  -webkit-mask:radial-gradient(circle 9px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 9px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat}
.ca-voucher .n{font-size:14px;display:flex;align-items:center;gap:10px}
.ca-voucher .v{font-family:'Bodoni Moda',serif;font-weight:600;font-size:24px;font-variant-numeric:lining-nums tabular-nums}
.ca-tabs{display:flex;background:var(--paper);border-top:3px double var(--rule);padding:8px 4px 20px}
.ca-tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--ink2);text-align:center;position:relative}
.ca-tabs button.on{color:var(--ink);font-weight:600}
.ca-tabs button.on::before{content:'';position:absolute;top:-14px;width:7px;height:7px;background:var(--blue);transform:rotate(45deg)}
.ca .sheet-bg{background:rgba(27,42,58,.4)}
.ca .sheet{background:var(--paper);border-top:3px double var(--ink);padding:18px 22px 26px}
.ca-sh-d{font-size:15px;color:var(--ink2)}
.ca-sh-v{font-family:'Bodoni Moda',serif;font-weight:600;font-size:34px;margin:2px 0;font-variant-numeric:lining-nums tabular-nums}
.ca-cats{display:grid;grid-template-columns:1fr 1fr;column-gap:16px;margin-top:8px}
.ca-cats button{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14px;text-align:left}
.ca-cats button.on{font-weight:700}
.ca-cats button.on::after{content:'';width:7px;height:7px;background:var(--blue);transform:rotate(45deg);margin-left:auto}
.ca .rtog{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:12px 0;margin-top:14px}
.ca .rtog .sw{background:var(--rule);border-radius:11px}.ca .rtog .sw::after{border-radius:50%}
.ca .rtog.on .sw{background:var(--blue)}
.ca .rule-row{border-bottom:1px solid var(--rule)}
.ca .rule-row button{border:1px solid var(--rule);border-radius:50%}
.ca .toast{background:var(--ink);color:var(--paper);border-radius:4px;border:3px double #5d6e80}

/* =========================================================
   B · Azulejo
   ========================================================= */
.cb{--tile:#F6F7F9;--grout:#D9DEE7;--cob:#2147C4;--navy:#121A3D;--ink2:#5C6481;--sun:#F2B705;--leaf:#188A5A;--rose:#D64570;
  background:var(--tile);color:var(--navy);font-family:'Jost',sans-serif;display:flex;flex-direction:column;position:relative}
.cb-head{padding:22px 18px 10px}
.cb-top{display:flex;justify-content:space-between;align-items:center}
.cb-title{font-weight:500;font-size:32px;letter-spacing:-.02em}
.cb-hbtn{font-size:13px;font-weight:500;padding:6px 12px;background:var(--navy);color:var(--tile)}
.cb-months{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:12px;background:var(--grout);border:3px solid var(--grout)}
.cb-months button{aspect-ratio:1;background:var(--tile);font-size:13px;font-weight:500;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;position:relative;overflow:hidden;text-align:left}
.cb-months button small{font-size:10px;color:var(--ink2);font-weight:400}
.cb-months button.on{background:var(--cob);color:#fff}
.cb-months button.on small{color:#c9d3f5}
.cb-months button.on::before{content:'';position:absolute;right:-18px;top:-18px;width:36px;height:36px;border-radius:50%;background:var(--sun)}
.cb-main{flex:1;overflow-y:auto;padding:4px 18px 28px}
.cb-wall{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--grout);border:3px solid var(--grout)}
.cb-t{position:relative;overflow:hidden;background:var(--tile);padding:12px;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end}
.cb-t .k{font-size:13px;position:relative}
.cb-t .v{font-size:19px;font-weight:500;position:relative;font-variant-numeric:tabular-nums}
.cb-t svg.m{position:absolute;right:-1px;top:-1px;width:58px;height:58px}
.cb-t.saldo{grid-column:1 / -1;background:var(--navy);color:#fff;min-height:132px;padding:16px}
.cb-t.saldo .v{font-size:38px;font-weight:400;letter-spacing:-.02em}
.cb-t.saldo svg.m{width:132px;height:132px;right:-2px;top:-2px}
.cb-t.saldo .s{font-size:12.5px;color:#b9c1dd;position:relative}
.cb-t.gastos{background:var(--cob);color:#fff}
.cb-t.aportes{background:var(--sun)}
.cb-sec{margin-top:24px}
.cb-h{font-size:18px;font-weight:500;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.cb-h small{font-size:12px;font-weight:400;color:var(--ink2)}
.cb-legend{display:flex;gap:16px;font-size:12px;color:var(--ink2);margin-top:6px}
.cb-legend span{display:flex;align-items:center;gap:6px}
.cb-legend i{width:10px;height:10px;display:block}
.cb-row{display:flex;align-items:center;gap:12px;padding:9px 0;width:100%;text-align:left;border-bottom:3px solid var(--grout)}
.cb-row:last-child{border-bottom:0}
.cb-row .t{flex:1;min-width:0}
.cb-row .d{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-row .s{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-row .s em{font-style:normal;color:var(--cob);font-weight:500}
.cb-row .r{text-align:right;flex:none}
.cb-row .r b{display:block;font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
.cb-row .r small{font-size:11px;color:var(--ink2)}
.cb-row.muted{opacity:.45}
.cb-tag{display:inline-block;font-size:11px;padding:0 6px;background:var(--grout);margin-left:4px}
.cb-glyph{display:block;flex:none}
.cb-seg,.cb-accs{display:grid;gap:3px;background:var(--grout);border:3px solid var(--grout);margin-bottom:14px}
.cb-seg{grid-template-columns:1fr 1fr}
.cb-accs{grid-template-columns:repeat(5,1fr);margin-bottom:4px}
.cb-seg button,.cb-accs button{background:var(--tile);padding:10px 4px;font-size:13.5px;font-weight:500;text-align:center}
.cb-accs button{font-size:12px;padding:10px 2px}
.cb-seg button.on,.cb-accs button.on{background:var(--cob);color:#fff}
.cb-filter{display:inline-block;margin:10px 0 0;padding:6px 12px;background:var(--navy);color:#fff;font-size:13px}
.cb-day{font-size:13px;font-weight:500;color:var(--ink2);margin:18px 0 4px;display:flex;align-items:center;gap:8px}
.cb-day::after{content:'';flex:1;height:3px;background:var(--grout)}
.cb-big{font-size:46px;font-weight:300;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.cb-sub{font-size:13px;color:var(--ink2);margin-top:2px}
.cb-sub.pos{color:var(--leaf)}
.cb-fine{font-size:12px;color:var(--ink2);line-height:1.45;margin-top:8px}
.cb-items{padding:0 0 8px 46px;font-size:13px;color:var(--ink2)}
.cb-items div{display:flex;justify-content:space-between;padding:3px 0}
.cb-ben{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--grout);border:3px solid var(--grout)}
.cb-ben .cb-t{min-height:110px}
.cb-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:var(--grout);border-top:3px solid var(--grout)}
.cb-tabs button{background:var(--tile);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 22px;font-size:11px;text-align:center}
.cb-tabs button.on{background:var(--cob);color:#fff}
.cb .sheet-bg{background:rgba(18,26,61,.45)}
.cb .sheet{background:var(--tile);border-top:8px solid var(--cob);padding:18px 18px 26px}
.cb-sh-v{font-size:34px;font-weight:400;letter-spacing:-.02em;margin:2px 0;font-variant-numeric:tabular-nums}
.cb-cats{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;background:var(--grout);border:3px solid var(--grout);margin-top:10px}
.cb-cats button{background:var(--tile);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;font-size:11.5px;text-align:center}
.cb-cats button.on{background:var(--navy);color:#fff}
.cb .rtog{background:#fff;border:3px solid var(--grout);padding:10px 12px;margin-top:14px}
.cb .rtog .sw{background:var(--grout)}
.cb .rtog.on .sw{background:var(--cob)}
.cb .rule-row{border-bottom:3px solid var(--grout)}
.cb .rule-row button{background:var(--grout)}
.cb .toast{background:var(--navy);color:#fff;border-left:8px solid var(--sun)}

/* =========================================================
   C · Cartaz
   ========================================================= */
.cc{--paper:#F2F3F7;--ink:#15172E;--ink2:#5D6078;--ultra:#2B36D9;--emer:#0B5A44;--sun:#F5C518;--rasp:#D3245F;--bg:var(--paper);--fg:var(--ink);--fg2:var(--ink2);
  background:var(--bg);color:var(--fg);font-family:'Anybody',sans-serif;font-variation-settings:'wdth' 100,'wght' 450;display:flex;flex-direction:column;position:relative;transition:background .25s}
.cc.t-mes{--bg:var(--ultra);--fg:#F2F3F7;--fg2:#C2C6FF}
.cc.t-pat{--bg:var(--emer);--fg:#F2F3F7;--fg2:#A8D5C4}
.cc.t-ben{--bg:var(--sun);--fg:var(--ink);--fg2:#5A4A08}
.cc .w{font-variation-settings:'wdth' 140,'wght' 800}
.cc-head{padding:24px 20px 4px}
.cc-top{display:flex;justify-content:space-between;align-items:center}
.cc-title{font-size:30px;line-height:1;letter-spacing:-.01em;font-variation-settings:'wdth' 150,'wght' 850;font-weight:850}
.cc-hbtn{font-size:13px;padding:7px 14px;border-radius:999px;background:var(--fg);color:var(--bg);font-variation-settings:'wdth' 110,'wght' 650}

// Stretch big numbers to the column width with the font's width axis (C only).
function fitAll() {
  document.querySelectorAll('#app [data-fit]').forEach(el => {
    const box = el.parentElement.clientWidth, wght = el.dataset.wght || 800; let size = +el.dataset.fit, lo = 50, hi = 150;
    el.style.fontSize = size + 'px';
    const set = w => { el.style.fontVariationSettings = `'wdth' ${w}, 'wght' ${wght}`; };
    for (let i = 0; i < 12; i++) { const mid = (lo + hi) / 2; set(mid); if (el.getBoundingClientRect().width <= box) lo = mid; else hi = mid; }
    set(lo);
    while (el.getBoundingClientRect().width > box && size > 24) { size -= 2; el.style.fontSize = size + 'px'; }
  });
}

  <li>Vale misturar, por exemplo a cédula do saldo com as cores por aba do Cartaz.</li></ul>
  <h3>Estado (em memória)</h3><div class="state">direção: ${S.variant}
aba: ${S.tab}
mês: ${S.month}
regras:
${esc(rules)}
ajustes manuais: ${Object.keys(S.overrides).length}</div>
  <p class="fine">Dados inventados no formato da sua planilha. Nenhum valor é real. As cores de categoria passaram no validador de daltonismo; Assinaturas, Contas fixas e Outros dividem o cinza nos gráficos.</p>`;
}
let toastTimer;
function toast(msg) { S.toast = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; render(); }, 3000); }
function applyRecat(id, cat) {
  const t = findTx(id);
  if (S.ruleOn) {
    const key = ruleKey(t);
    S.rules = S.rules.filter(r => r.match.toLowerCase() !== key.toLowerCase()); S.rules.unshift({ match: key, cat });
    ALL_TX.forEach(x => { if (ruleKey(x).toLowerCase().includes(key.toLowerCase())) delete S.overrides[x.id]; });
    toast(`Regra criada: “${esc(key)}” vira ${CATS[cat].label} em ${countRule(S.rules[0])} transações`);
  } else { S.overrides[id] = cat; toast(`“${esc(t.desc)}” agora é ${CATS[cat].label}`); }
  S.ruleOn = false;
}
function setVariant(v) { S.variant = v; try { const u = new URL(location.href); u.searchParams.set('variant', v); history.replaceState(null, '', u); } catch (e) { /* file:// may refuse */ } }
const shiftMonth = d => { S.month = MONTHS[Math.min(MONTHS.length - 1, Math.max(0, monthIdx() + d))].key; S.week = null; };
const ACT = {
  'variant-prev': () => setVariant(ORDER[(ORDER.indexOf(S.variant) + 2) % 3]), 'variant-next': () => setVariant(ORDER[(ORDER.indexOf(S.variant) + 1) % 3]),
  'month-prev': () => shiftMonth(-1), 'month-next': () => shiftMonth(1), 'month-set': k => { S.month = k; S.week = null; },
  'tab': t => { S.tab = t; S.sheet = null; if (t !== 'tx') { S.cat = null; S.week = null; } },
  'gmode': m => { S.gmode = m; }, 'acc': a => { S.acc = a; },
  'go-cat': c => { S.tab = 'tx'; S.cat = c; S.week = null; S.acc = 'all'; }, 'go-week': i => { S.tab = 'tx'; S.week = +i; S.cat = null; S.acc = 'all'; },
  'clear': () => { S.cat = null; S.week = null; }, 'pat-open': k => { S.patOpen = S.patOpen === k ? null : k; },
  'rules': () => { S.sheet = { rules: true }; }, 'sheet-close': () => { S.sheet = null; },
  'tx-open': id => { S.ruleOn = false; S.sheet = { tx: id }; }, 'rule-toggle': () => { S.ruleOn = !S.ruleOn; },
  'recat': (cat, el) => { applyRecat(el.dataset.tx, cat); S.sheet = null; }, 'rule-del': i => { S.rules.splice(+i, 1); },
  'ben-empty': () => { S.benEmpty = !S.benEmpty; },
};
const VIEWS = { A: RA, B: RB, C: RC };
function render() {
  const app = document.getElementById('app');
  app.querySelectorAll('[data-scroll]').forEach(el => { SCROLL[el.dataset.scroll] = el.scrollTop; });
  app.innerHTML = VIEWS[S.variant]();
  app.querySelectorAll('[data-scroll]').forEach(el => { const y = SCROLL[el.dataset.scroll]; if (y) el.scrollTop = y; });
  fitAll();
  document.getElementById('sw-label').textContent = `${S.variant}. ${THEMES[S.variant].name}`;
  renderNotes();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.getAttribute('data-act'); if (act === 'noop') return;
  const fn = ACT[act]; if (!fn) return;
  fn(el.getAttribute('data-arg'), el); render();
});
document.addEventListener('keydown', e => {
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.isContentEditable)) return;
  if (e.key === 'ArrowLeft') { ACT['variant-prev'](); render(); }
  if (e.key === 'ArrowRight') { ACT['variant-next'](); render(); }
});
const qv = (new URLSearchParams(location.search).get('variant') || '').toUpperCase();
if (ORDER.includes(qv)) S.variant = qv;
render();
if (document.fonts) document.fonts.ready.then(fitAll);
</script>

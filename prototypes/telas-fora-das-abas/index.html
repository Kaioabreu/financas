<title>PROTÓTIPO · Telas fora das abas</title>
<!--
  PROTOTYPE, throwaway. Do not build on this code.
  Round 1 of issue #18 ("Como devem ser as telas fora das abas?").
  Visual language comes from prototype/telas-v1 (refino.html, variant B): Jost, white or black background, flat ruled lists.
  Question now: how do the screens outside the four tabs hang off them?
    A. Engrenagem: a gear on every tab opens Configurações, which pushes Conexões, which pushes one bank.
    B. Duas portas: a status line on Resumo opens Conexões (banks expand in place); the gear (Resumo only) opens Configurações.
    C. Página única: your initial on every tab opens one long page with everything, Conexões inline; flows open as sheets.
  The leaf screens (onboarding, credentials, lock, backup, restore, edit, rules, errors, wipe, credits) are one shared proposal.
  Switch with ?variant=A|B|C and the floating bar (keys ← →); the moon/sun button flips light/dark.
  Sample data is invented. No value is real.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300..700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#d9d8d3;color:#1c1c1e;-webkit-font-smoothing:antialiased}
body.dark-stage{background:#2a2a2c}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;letter-spacing:inherit}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid #2D62B0;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- stage (not part of the design) ---------- */
.stage{min-height:100vh;display:flex;gap:40px;align-items:center;justify-content:center;padding:28px 24px 100px}
.phone{width:390px;height:800px;border-radius:48px;border:12px solid #17171a;background:#000;position:relative;overflow:hidden;box-shadow:0 40px 80px -30px rgba(0,0,0,.45);flex:none}
#app{position:absolute;inset:0;overflow:hidden}
#app>div{height:100%}
#app *{scrollbar-width:none}
#app *::-webkit-scrollbar{display:none}
.notes{width:360px;font-size:14px;line-height:1.55;color:#33322f;max-height:800px;overflow:auto;padding-right:6px}
.dark-stage .notes{color:#d8d6d0}
.notes .n-tag{display:inline-block;background:#ffcc00;color:#111;font-weight:700;font-size:11px;letter-spacing:.06em;padding:3px 8px;border-radius:6px}
.notes h1{font-size:22px;margin:10px 0 2px}
.notes h2{font-size:17px;margin:14px 0 4px}
.notes h3{font-size:13px;opacity:.7;margin:16px 0 6px}
.notes ul{padding-left:18px}.notes li{margin:3px 0}
.notes .go{display:flex;flex-wrap:wrap;gap:6px}
.notes .go button{font-size:12.5px;padding:3px 10px;border:1px solid rgba(127,127,127,.45);border-radius:999px}
.notes .go button:hover,.notes .sc button:hover{background:rgba(127,127,127,.15)}
.notes .sc{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.notes .sc button{font-size:12.5px;padding:5px 9px;border:1px solid rgba(127,127,127,.45);border-radius:8px;text-align:left;line-height:1.3}
.notes .sc b{display:block;font-weight:600}
.notes .state{font-family:ui-monospace,Consolas,monospace;font-size:12px;background:rgba(127,127,127,.12);border-radius:8px;padding:8px 10px;white-space:pre-wrap}
.notes .fine{font-size:12px;opacity:.75;margin-top:12px}
.switcher{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;background:#111;color:#fff;border-radius:999px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:1000;font-size:14px;outline:2px dashed #ffcc00;outline-offset:3px;font-family:system-ui,sans-serif}
.switcher button{width:38px;height:38px;border-radius:50%;color:#fff;font-size:18px;text-align:center}
.switcher button:hover{background:#333}
.switcher .lbl{padding:0 10px;min-width:170px;text-align:center;font-weight:600;white-space:nowrap}
.switcher .sep{width:1px;height:22px;background:#444;margin:0 4px}
@media (max-width:860px){.notes{display:none}}
@media (max-width:520px){.stage{padding:0;display:block}.phone{width:100vw;height:100vh;height:100dvh;border:0;border-radius:0}.switcher{top:8px;bottom:auto;font-size:12px}.switcher .lbl{min-width:110px}.switcher button{width:30px;height:30px}}

/* ---------- the look (from refino.html, variant B: Jost) ---------- */
.r3{--bg:#FFFFFF;--ink:#111418;--ink2:#5E6670;--rule:#E7E9EC;--track:#F0F2F4;--acc:#2D62B0;--pos:#1E7A4C;--neg:#B8325A;--warn:#8F6200;
  background:var(--bg);color:var(--ink);font-family:'Jost',sans-serif;font-weight:400;display:flex;flex-direction:column;position:relative}
.r3.dark{--bg:#000000;--ink:#F2F3F5;--ink2:#9AA1AA;--rule:#202328;--track:#16181B;--acc:#6E9BE6;--pos:#4CC38A;--neg:#E0577F;--warn:#D4A12A}
.r3 .num{font-variant-numeric:tabular-nums;font-weight:500}
.r3 .ttl{font-weight:500}
.r3-head{padding:22px 22px 4px}
.r3-top{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:40px}
.r3-top .acts{display:flex;align-items:center;gap:12px}
.r3-title{font-size:32px;letter-spacing:-.02em;line-height:1.1;font-weight:500}
.r3-title.mid{font-size:28px}
.r3-back{display:flex;align-items:center;gap:2px;margin:-6px 0 8px -8px;font-size:14px;color:var(--ink2);padding:4px 8px 4px 4px}
.r3-link{font-size:13.5px;color:var(--acc);font-weight:500}
.hbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--ink);margin-right:-6px}
.avatar{width:34px;height:34px;border-radius:50%;border:1px solid var(--ink);display:grid;place-items:center;font-size:15px;font-weight:500;text-align:center}
.r3-month{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:14px;color:var(--ink2)}
.r3-month button{width:28px;height:28px;border:1px solid var(--rule);border-radius:50%;color:var(--ink);font-size:15px;text-align:center}
.r3-month em{font-style:normal;font-size:12px;color:var(--neg)}
.status{display:flex;align-items:flex-start;gap:8px;margin-top:10px;font-size:13.5px;color:var(--ink2);text-align:left;line-height:1.35}
.status i{width:7px;height:7px;border-radius:50%;flex:none;margin-top:6px}
.status.warn{color:var(--ink)}
.status .go{color:var(--acc);font-weight:500;white-space:nowrap}
.status-sub{font-size:12.5px;color:var(--ink2);margin:4px 0 0 15px;display:flex;gap:14px}
.status-sub button{text-decoration:underline;text-underline-offset:3px}
.r3-main{flex:1;overflow-y:auto;padding:10px 20px 28px}
.r3-foot{padding:10px 20px 26px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--rule)}
.r3-foot.flat{border-top:0}
.r3-hero{padding:10px 0 6px}
.r3-hero .k{font-size:13.5px;color:var(--ink2)}
.r3-hero .v{font-size:46px;letter-spacing:-.025em;line-height:1.08;margin-top:2px}
.r3-hero .s{font-size:12.5px;color:var(--ink2);margin-top:4px}
.r3-sec{margin-top:28px}
.r3-h{font-size:17px;margin-bottom:6px;font-weight:500}
.r3-gh{font-size:12px;font-weight:500;color:var(--ink2);margin:26px 0 0;letter-spacing:.06em;text-transform:uppercase}
.r3-gh:first-child{margin-top:8px}
.r3-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule);width:100%;text-align:left}
.r3-row.block{display:block}
.r3-row.block>.line{display:flex;align-items:center;gap:12px}
.r3-ic{width:38px;height:38px;border-radius:50%;border:1px solid;display:grid;place-items:center;flex:none}
.r3-ic.sm{width:32px;height:32px}
.r3-ic.mark{font-size:14px;font-weight:500;color:var(--ink);border-color:var(--ink)}
.r3-row .t{flex:1;min-width:0}
.r3-row .d{display:block;font-size:15px}
.r3-row .s{display:block;font-size:12.5px;color:var(--ink2);margin-top:2px;line-height:1.35}
.r3-row .s em{font-style:normal;color:var(--acc)}
.r3-row .r{text-align:right;flex:none}
.r3-row .r b{display:block;font-weight:500;font-size:16.5px}
.r3-row .r small{font-size:11px;color:var(--ink2)}
.r3-row.muted{opacity:.45}
.r3-row .chev{color:var(--ink2);flex:none;display:grid;transition:transform .15s}
.r3-row .chev.up{transform:rotate(90deg)}
.r3-bar{display:block;height:4px;border-radius:2px;background:var(--track);margin-top:9px;overflow:hidden}
.r3-bar i{display:block;height:100%;border-radius:2px}
.r3-seg{display:flex;gap:22px;margin:6px 0 14px;font-size:15px;border-bottom:1px solid var(--rule)}
.r3-seg button,.r3-accs button{padding:8px 0;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
.r3-seg button.on,.r3-accs button.on{color:var(--ink);border-color:var(--ink);font-weight:500}
.r3-accs{display:flex;gap:18px;overflow-x:auto;margin:4px 0 6px;font-size:14px;border-bottom:1px solid var(--rule)}
.r3-accs button{flex:none}
.r3-day{font-size:13px;font-weight:500;color:var(--ink2);margin:20px 0 0}
.r3-big{font-size:44px;letter-spacing:-.025em;line-height:1.08;font-weight:500}
.r3-sub{font-size:14px;color:var(--ink2);margin-top:6px;line-height:1.45}
.r3-p{font-size:15px;line-height:1.5;margin-top:10px}
.r3-fine{font-size:12.5px;color:var(--ink2);line-height:1.45;margin-top:10px}
.center{text-align:center}
.r3-tabs{display:flex;background:var(--bg);border-top:1px solid var(--rule);padding:10px 4px 20px}
.r3-tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--ink2);text-align:center;position:relative}
.r3-tabs button.on{color:var(--ink);font-weight:500}
.r3-tabs button.on::before{content:'';position:absolute;top:-11px;width:18px;height:2px;border-radius:1px;background:var(--ink)}

/* ---------- new pieces for this round ---------- */
.aviso{display:flex;gap:12px;padding:12px 0 13px;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);margin:4px 0 8px}
.aviso .av-ic{flex:none;margin-top:1px}
.aviso b{font-weight:500;font-size:15px;display:block;line-height:1.3}
.av-a{display:flex;gap:18px;margin-top:6px;flex-wrap:wrap}
.aviso.row{border-top:0;margin:0;align-items:center}
.lnk{color:var(--acc);font-weight:500;font-size:13.5px}
.lnk.mute{color:var(--ink2);font-weight:400}
.lnk.neg{color:var(--neg)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:15.5px;font-weight:500;text-align:center}
.btn.sec{background:none;color:var(--ink);border:1px solid var(--rule)}
.btn.sec.neg{color:var(--neg)}
.btn.danger{background:var(--neg);color:#fff}
.btn.sm{padding:9px 14px;font-size:14px;width:auto;border-radius:10px}
.btns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.links{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:12px}
.mt{margin-top:18px}
.stblock{padding:4px 0 6px}
.stblock .st{font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px}
.stblock .st i{width:8px;height:8px;border-radius:50%}
.stblock p{font-size:14.5px;line-height:1.45;margin-top:6px}
.fact{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.fact span:first-child{color:var(--ink2);flex:none}
.fact span:last-child{text-align:right}
.acc.open>.r3-row{border-bottom:0}
.acc-body{padding:0 0 16px 44px;border-bottom:1px solid var(--rule)}
.acc-body p{font-size:14px;line-height:1.45}
.acc-body .fact{font-size:13.5px;padding:8px 0}
.cblock{padding:14px 0 16px;border-bottom:1px solid var(--rule)}
.cblock .line{display:flex;align-items:center;gap:12px}
.cblock .d{display:block;font-size:15.5px}
.cblock .s{display:block;font-size:12.5px;margin-top:1px}
.cblock p{font-size:14px;line-height:1.45;margin-top:8px}
.fld{display:block;margin-top:20px}
.fld>span{display:block;font-size:12.5px;color:var(--ink2)}
.fld input{display:block;width:100%;border:0;border-bottom:1px solid var(--ink2);background:none;padding:8px 0;font-size:16.5px;outline:none;color:var(--ink);font-family:inherit;border-radius:0}
.fld input:focus{border-bottom:2px solid var(--acc);padding-bottom:7px}
.fld .fixed{padding:8px 0;font-size:16.5px;border-bottom:1px solid var(--rule);color:var(--ink2)}
.note{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.4;margin-top:16px}
.note>span:first-child{flex:none;margin-top:1px}
.note.neg{color:var(--neg)}
.errbox{border-left:2px solid var(--neg);padding:4px 0 4px 12px;margin-top:18px;font-size:14px;line-height:1.45}
.errbox .links{margin-top:6px}
.welcome{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 24px}
.welcome .r3-big{font-size:52px}
.welcome p{font-size:16.5px;line-height:1.45;color:var(--ink2);margin-top:14px}
.need{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);font-size:15px;line-height:1.4}
.need .n{width:26px;height:26px;border-radius:50%;border:1px solid var(--ink);display:grid;place-items:center;font-size:13px;flex:none;font-weight:500}
.know{display:flex;gap:12px;padding:10px 0;font-size:14.5px;line-height:1.4;align-items:flex-start}
.know>span:first-child{color:var(--acc);flex:none;margin-top:1px}
.progress{height:3px;background:var(--track);border-radius:2px;overflow:hidden;margin-top:26px}
.progress i{display:block;height:100%;width:35%;background:var(--acc);border-radius:2px;animation:slide 1.2s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.lockscr{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
.lockscr .r3-big{font-size:36px}
.diag{font-family:ui-monospace,Consolas,monospace;font-size:11px;line-height:1.55;background:var(--track);border-radius:10px;padding:12px;white-space:pre-wrap;margin-top:8px;color:var(--ink2)}
.empty{text-align:center;padding:70px 18px;line-height:1.45}
.empty b{display:block;font-size:20px;font-weight:500;margin-top:16px}
.empty p{font-size:14px;color:var(--ink2);margin:6px 0 20px}
.empty .r3-ic{margin:0 auto;width:54px;height:54px;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;column-gap:16px;margin-top:4px}
.grid2 button{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14px;text-align:left;line-height:1.25}
.grid2 button.on{font-weight:500}
.grid2 button.on::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--acc);margin-left:auto;flex:none}
.rtog{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font-size:14.5px;line-height:1.35;padding:12px 0;border-bottom:1px solid var(--rule)}
.rtog .sw{width:38px;height:22px;position:relative;flex:none;background:var(--rule);border-radius:11px;transition:background .15s}
.rtog .sw::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;background:#fff;border-radius:50%;transition:left .15s}
.rtog.on .sw{background:var(--acc)}
.rtog.on .sw::after{left:19px}
.rtog small{display:block;color:var(--ink2);font-size:12.5px;margin-top:2px}
.rtog>span:last-child{flex:1}
.rtog.dis{cursor:default}.rtog.dis .sw{opacity:.4}
.rtog.boxed{border-top:1px solid var(--rule);margin-top:12px}
.rulein{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2);padding:10px 0 2px}
.rulein input{flex:1;border:0;border-bottom:1px solid var(--ink2);background:none;color:var(--ink);font:inherit;font-size:15px;padding:4px 0;outline:none}
.rule-row{display:flex;align-items:center;gap:10px;padding:12px 0;font-size:14.5px;border-bottom:1px solid var(--rule);line-height:1.35}
.rule-row>span{flex:1}.rule-row small{display:block;color:var(--ink2);font-size:12.5px;margin-top:2px}
.rule-row button{width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--rule);border-radius:50%;flex:none}
.sheet-bg{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-end;background:rgba(0,0,0,.45)}
.sheet{width:100%;max-height:90%;overflow:auto;cursor:default;background:var(--bg);border-radius:18px 18px 0 0;border-top:1px solid var(--rule);padding:12px 22px 26px}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 14px}
.sh-t{font-size:24px;font-weight:500;letter-spacing:-.01em}
.sh-d{font-size:15px;color:var(--ink2)}
.sh-v{font-size:34px;letter-spacing:-.02em;margin:2px 0}
.toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:90;padding:12px 16px;font-size:13.5px;background:var(--ink);color:var(--bg);border-radius:12px;line-height:1.4}

/* ---------- system UI and the Meu Pluggy tab (not our design; generic Android look) ---------- */
.sys-bg{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.5);display:flex;align-items:flex-end}
.sys-sheet{width:100%;background:#F3EDF7;color:#1D1B20;border-radius:28px 28px 0 0;padding:22px 22px 28px;font-family:Roboto,system-ui,sans-serif}
.sys-sheet.bio{text-align:center}
.sys-sheet b{font-size:20px;font-weight:500;display:block}
.sys-sheet p{font-size:14px;color:#49454F;margin-top:6px}
.sys-tag{display:inline-block;font-size:10px;letter-spacing:.06em;background:#ffcc00;color:#111;padding:2px 6px;border-radius:4px;margin-bottom:10px;font-weight:700;font-family:system-ui,sans-serif}
.fp{display:grid;place-items:center;margin:20px auto 6px;width:72px;height:72px;border-radius:50%;color:#6750A4;background:#E8DEF8}
.sys-btns{display:flex;justify-content:space-between;margin-top:18px}
.sys-btns button{color:#6750A4;font-weight:500;font-size:14px;padding:8px}
.sys-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px;text-align:center;font-size:12px}

.sys-grid i{width:48px;height:48px;border-radius:50%;background:#E8DEF8;display:block}
.sys-file{font-size:14px;padding:4px 0 12px;border-bottom:1px solid #CAC4D0}
.sys-list button{display:block;width:100%;padding:12px 0;border-bottom:1px solid #CAC4D0;font-size:14.5px;text-align:left}
.sys-list small{display:block;font-size:12px;color:#49454F}
.ctab{position:absolute;inset:0;z-index:60;background:#fff;color:#1f1f1f;display:flex;flex-direction:column;font-family:Roboto,system-ui,sans-serif}
.ct-bar{display:flex;align-items:center;gap:14px;padding:30px 14px 12px;background:#f1f3f4;border-bottom:1px solid #ddd}
.ct-bar button{font-size:20px;width:32px;height:32px}
.ct-bar b{display:block;font-size:15px;font-weight:500}
.ct-bar small{font-size:12px;color:#5f6368}
.ct-body{flex:1;padding:26px 22px;overflow:auto}

.ct-opt{display:flex;align-items:center;gap:12px;width:100%;padding:13px 4px;border-bottom:1px solid #eee;font-size:15px;text-align:left}
.ct-opt i{width:18px;height:18px;border-radius:50%;border:2px solid #888;flex:none}

.ct-go{display:block;width:100%;margin-top:22px;padding:14px;border-radius:10px;background:#1f1f1f;color:#fff;text-align:center;font-size:15px;font-weight:500}
</style>

<body>
<div class="stage">
  <div class="phone"><div id="app"></div></div>
  <aside class="notes" id="notes"></aside>
</div>
<div class="switcher" role="toolbar" aria-label="Trocar variante do protótipo">

const SCROLL = {};
